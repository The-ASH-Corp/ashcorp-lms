version: '3.8'

services:
  ashcorp-lms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashcorp-lms-app
    restart: always
    ports:
      - "3000:3000"
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api
      - NEXT_PUBLIC_IMAGE_URL=http://localhost:5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
